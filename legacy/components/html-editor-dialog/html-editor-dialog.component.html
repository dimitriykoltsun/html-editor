<div
  class="dialog-wrap">
  <h2 mat-dialog-title>Add image</h2>
  <mat-dialog-content>
    <mat-form-field class="example-full-width" style="width: 100%;">
      <mat-label>Insert image url</mat-label>
      <input matInput [(ngModel)]="imgURL">
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button [mat-dialog-close]="true" (click)="onButtonSave()">Save</button>
    <button mat-button mat-dialog-close (click)="onButtonClick()">Close</button>
  </mat-dialog-actions>
</div>
